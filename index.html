<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADM.INOVA — Mostra Digital de Administração e Empreendedorismo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: '#101B35',
              institutional: '#244B82',
              vibrant: '#3988E8',
              cyan: '#63C5E8',
              lightbg: '#F8FAFC'
            }
          }
        }
      }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QRCode Generator -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body class="bg-lightbg text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [currentView, setCurrentView] = React.useState('catalog');
            const [platforms, setPlatforms] = React.useState(() => {
                const saved = localStorage.getItem('admin_inova_platforms');
                return saved ? JSON.parse(saved) : [];
            });
            const [isAdminLoggedIn, setIsAdminLoggedIn] = React.useState(() => {
                return localStorage.getItem('admin_inova_logged') === 'true';
            });
            const [showLoginModal, setShowLoginModal] = React.useState(false);
            const [loginUser, setLoginUser] = React.useState('');
            const [loginPass, setLoginPass] = React.useState('');
            const [loginError, setLoginError] = React.useState('');

            const [form, setForm] = React.useState({
                title: '',
                description: '',
                problem: '',
                objective: '',
                developers: '',
                url: '',
                imageUrl: '',
                status: 'Disponível'
            });
            const [editingId, setEditingId] = React.useState(null);

            React.useEffect(() => {
                localStorage.setItem('admin_inova_platforms', JSON.stringify(platforms));
            }, [platforms]);

            React.useEffect(() => {
                localStorage.setItem('admin_inova_logged', isAdminLoggedIn);
            }, [isAdminLoggedIn]);

            React.useEffect(() => {
                setTimeout(() => {
                    if (window.lucide) {
                        window.lucide.createIcons();
                    }
                }, 100);
            }, [currentView, platforms, isAdminLoggedIn, showLoginModal]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (loginUser === 'admin' && loginPass === 'admin2026') {
                    setIsAdminLoggedIn(true);
                    setShowLoginModal(false);
                    setLoginError('');
                    setLoginUser('');
                    setLoginPass('');
                    setCurrentView('admin');
                } else {
                    setLoginError('Usuário ou senha incorretos.');
                }
            };

            const handleLogout = () => {
                setIsAdminLoggedIn(false);
                setCurrentView('catalog');
            };

            const handleSavePlatform = (e) => {
                e.preventDefault();
                if (!form.title || !form.url) {
                    alert('Preencha pelo menos o Nome da Plataforma e o Link de Acesso.');
                    return;
                }

                if (editingId) {
                    setPlatforms(platforms.map(p => p.id === editingId ? { ...form, id: editingId } : p));
                    setEditingId(null);
                } else {
                    const newPlatform = {
                        ...form,
                        id: Date.now().toString(),
                        createdAt: new Date().toLocaleDateString('pt-BR')
                    };
                    setPlatforms([newPlatform, ...platforms]);
                }

                setForm({
                    title: '',
                    description: '',
                    problem: '',
                    objective: '',
                    developers: '',
                    url: '',
                    imageUrl: '',
                    status: 'Disponível'
                });
                setCurrentView('catalog');
            };

            const handleEdit = (p) => {
                setForm(p);
                setEditingId(p.id);
                setCurrentView('admin');
            };

            const handleDelete = (id) => {
                if (confirm('Tem certeza que deseja excluir esta plataforma?')) {
                    setPlatforms(platforms.filter(p => p.id !== id));
                }
            };

            const generateQRCodeDataURL = (text) => {
                try {
                    const qr = qrcode(0, 'L');
                    qr.addData(text);
                    qr.make();
                    return qr.createDataURL(4);
                } catch (e) {
                    return '';
                }
            };

            return (
                <div className="min-h-screen flex bg-white">
                    {/* Menu Lateral Esquerdo */}
                    <aside className="w-64 bg-navy text-white flex flex-col justify-between hidden md:flex shrink-0 shadow-lg">
                        <div>
                            <div className="p-6 border-b border-white/10">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-vibrant to-cyan flex items-center justify-center font-bold text-white text-xl shadow-md">
                                        AI
                                    </div>
                                    <div>
                                        <h1 className="font-bold text-lg tracking-wide text-white">ADM.INOVA</h1>
                                        <p className="text-xs text-cyan">CETI José Marques</p>
                                    </div>
                                </div>
                            </div>
                            <nav className="p-4 space-y-2">
                                <button 
                                    onClick={() => setCurrentView('catalog')}
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition-all ${currentView === 'catalog' ? 'bg-vibrant text-white shadow-lg' : 'text-slate-300 hover:bg-white/5 hover:text-white'}`}>
                                    <i data-lucide="layout-grid" className="w-5 h-5"></i>
                                    <span>Catálogo de Plataformas</span>
                                </button>
                                <button 
                                    onClick={() => {
                                        if (isAdminLoggedIn) {
                                            setCurrentView('admin');
                                        } else {
                                            setShowLoginModal(true);
                                        }
                                    }}
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition-all ${currentView === 'admin' ? 'bg-vibrant text-white shadow-lg' : 'text-slate-300 hover:bg-white/5 hover:text-white'}`}>
                                    <i data-lucide="shield-check" className="w-5 h-5"></i>
                                    <span>Painel Administrativo</span>
                                </button>
                            </nav>
                        </div>
                        <div className="p-4 border-t border-white/10">
                            {isAdminLoggedIn ? (
                                <button 
                                    onClick={handleLogout}
                                    className="w-full flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white text-sm font-medium transition-colors">
                                    <i data-lucide="log-out" className="w-4 h-4"></i>
                                    <span>Sair do Admin</span>
                                </button>
                            ) : (
                                <button 
                                    onClick={() => setShowLoginModal(true)}
                                    className="w-full flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl bg-institutional/40 hover:bg-institutional text-cyan hover:text-white text-sm font-medium transition-colors border border-institutional">
                                    <i data-lucide="lock" className="w-4 h-4"></i>
                                    <span>Área do Administrador</span>
                                </button>
                            )}
                        </div>
                    </aside>

                    {/* Conteúdo Principal */}
                    <div className="flex-1 flex flex-col min-w-0">
                        {/* Header Superior Mobile & Desktop */}
                        <header className="h-20 bg-white border-b border-slate-100 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm">
                            <div className="flex items-center space-x-4">
                                <div className="md:hidden flex items-center space-x-2">
                                    <div className="w-8 h-8 rounded-lg bg-vibrant flex items-center justify-center font-bold text-white text-sm">
                                        AI
                                    </div>
                                    <span className="font-bold text-navy">ADM.INOVA</span>
                                </div>
                                <div>
                                    <h2 className="text-xl font-extrabold text-navy">Mostra Digital de Administração e Empreendedorismo</h2>
                                    <p className="text-xs text-slate-500">CETI José Marques • Administração com ênfase em Empreendedorismo</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-3">
                                {currentView !== 'admin' && (
                                    <button 
                                        onClick={() => {
                                            if (isAdminLoggedIn) setCurrentView('admin');
                                            else setShowLoginModal(true);
                                        }}
                                        className="flex items-center space-x-2 px-4 py-2 bg-navy text-white text-sm font-semibold rounded-xl hover:bg-institutional transition-all shadow-md">
                                        <i data-lucide={isAdminLoggedIn ? "settings" : "lock"} className="w-4 h-4 text-cyan"></i>
                                        <span>{isAdminLoggedIn ? "Painel Admin" : "Entrar Admin"}</span>
                                    </button>
                                )}
                            </div>
                        </header>

                        {/* Corpo Principal */}
                        <main className="flex-1 p-6 md:p-10 max-w-7xl w-full mx-auto">
                            {currentView === 'catalog' && (
                                <div className="space-y-8">
                                    {/* Hero Banner */}
                                    <div className="bg-gradient-to-r from-navy via-institutional to-vibrant rounded-3xl p-8 md:p-12 text-white shadow-xl relative overflow-hidden">
                                        <div className="relative z-10 max-w-2xl">
                                            <span className="inline-block px-3 py-1 rounded-full bg-cyan/20 text-cyan text-xs font-bold tracking-wider uppercase mb-4 border border-cyan/30">
                                                Day Escolar 2026
                                            </span>
                                            <h3 className="text-3xl md:text-5xl font-extrabold tracking-tight mb-4">
                                                Ideias que se transformam em soluções.
                                            </h3>
                                            <p className="text-slate-200 text-sm md:text-base leading-relaxed mb-6">
                                                Catálogo oficial das plataformas, sistemas e simuladores desenvolvidos pelos estudantes de Administração com ênfase em Empreendedorismo.
                                            </p>
                                            <div className="flex items-center space-x-6 text-sm">
                                                <div className="flex items-center space-x-2">
                                                    <div className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center font-bold text-cyan">
                                                        {platforms.length}
                                                    </div>
                                                    <span className="text-slate-300 font-medium">Plataformas Cadastradas</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Lista / Cards de Plataformas */}
                                    <div>
                                        <div className="flex items-center justify-between mb-6">
                                            <h4 className="text-2xl font-bold text-navy">Plataformas em Destaque</h4>
                                            <span className="text-sm font-medium text-slate-500">{platforms.length} {platforms.length === 1 ? 'projeto cadastrado' : 'projetos cadastrados'}</span>
                                        </div>

                                        {platforms.length === 0 ? (
                                            <div className="bg-slate-50 border-2 border-dashed border-slate-200 rounded-3xl p-12 text-center">
                                                <div className="w-16 h-16 bg-blue-50 text-vibrant rounded-2xl flex items-center justify-center mx-auto mb-4">
                                                    <i data-lucide="folder-open" className="w-8 h-8"></i>
                                                </div>
                                                <h5 className="text-lg font-bold text-navy mb-2">Nenhuma plataforma cadastrada ainda</h5>
                                                <p className="text-slate-500 text-sm max-w-md mx-auto mb-6">
                                                    O administrador do sistema ainda não cadastrou os projetos do ano. Faça login no painel administrativo para adicionar as plataformas.
                                                </p>
                                                <button 
                                                    onClick={() => setShowLoginModal(true)}
                                                    className="inline-flex items-center space-x-2 px-5 py-2.5 bg-vibrant text-white font-semibold rounded-xl hover:bg-institutional transition-all shadow-md text-sm">
                                                    <i data-lucide="shield-check" className="w-4 h-4"></i>
                                                    <span>Acessar Painel do Administrador</span>
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                {platforms.map(p => {
                                                    const qrDataUrl = generateQRCodeDataURL(p.url);
                                                    return (
                                                        <div key={p.id} className="bg-white border border-slate-100 rounded-2xl shadow-sm hover:shadow-md transition-shadow flex flex-col overflow-hidden">
                                                            {p.imageUrl ? (
                                                                <div className="h-48 w-full bg-slate-100 overflow-hidden relative">
                                                                    <img src={p.imageUrl} alt={p.title} className="w-full h-full object-cover" />
                                                                </div>
                                                            ) : (
                                                                <div className="h-40 w-full bg-gradient-to-br from-navy to-institutional flex items-center justify-center text-white p-6 relative">
                                                                    <div className="text-center">
                                                                        <i data-lucide="globe" className="w-10 h-10 mx-auto mb-2 text-cyan"></i>
                                                                        <span className="font-bold text-sm tracking-wide">{p.title}</span>
                                                                    </div>
                                                                </div>
                                                            )}
                                                            <div className="p-6 flex-1 flex flex-col justify-between">
                                                                <div>
                                                                    <div className="flex items-center justify-between mb-2">
                                                                        <span className="px-2.5 py-1 bg-blue-50 text-vibrant text-xs font-semibold rounded-md">
                                                                            {p.status || 'Disponível'}
                                                                        </span>
                                                                        <span className="text-xs text-slate-400">{p.createdAt}</span>
                                                                    </div>
                                                                    <h5 className="text-lg font-bold text-navy mb-2">{p.title}</h5>
                                                                    <p className="text-slate-600 text-xs line-clamp-3 mb-4 leading-relaxed">
                                                                        {p.description || 'Nenhuma descrição informada.'}
                                                                    </p>

                                                                    {p.developers && (
                                                                        <div className="flex items-center space-x-2 text-xs text-slate-500 mb-4 bg-slate-50 p-2 rounded-lg">
                                                                            <i dat                                                                        <div className="flex items-center space-x-2 text-xs text-slate-500 mb-4 bg-slate-50 p-2 rounded-lg">
                                                                            <i data-lucide="users" className="w-4 h-4 text-vibrant"></i>
                                                                            <span className="truncate"><strong>Desenvolvedores:</strong> {p.developers}</span>
                                                                        </div>
                                                                    )}
                                                                </div>

                                                                <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
                                                                    {qrDataUrl && (
                                                                        <div className="w-12 h-12 bg-white p-1 rounded border border-slate-200 shadow-sm">
                                                                            <img src={qrDataUrl} alt="QR Code" className="w-full h-full" />
                                                                        </div>
                                                                    )}
                                                                    <a 
                                                                        href={p.url} 
                                                                        target="_blank" 
                                                                        rel="noopener noreferrer"
                                                                        className="flex-1 ml-4 inline-flex items-center justify-center space-x-2 px-4 py-2.5 bg-vibrant hover:bg-institutional text-white font-semibold rounded-xl text-xs transition-colors shadow-sm">
                                                                        <span>Acessar Plataforma</span>
                                                                        <i data-lucide="external-link" className="w-3.5 h-3.5"></i>
                                                                    </a>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {currentView === 'admin' && isAdminLoggedIn && (
                                <div className="space-y-8">
                                    <div className="flex items-center justify-between pb-6 border-b border-slate-100">
                                        <div>
                                            <h3 className="text-2xl font-bold text-navy">Painel Administrativo</h3>
                                            <p className="text-sm text-slate-500">Cadastre e gerencie as plataformas e sistemas da mostra.</p>
                                        </div>
                                        <button 
                                            onClick={() => {
                                                setForm({
                                                    title: '',
                                                    description: '',
                                                    problem: '',
                                                    objective: '',
                                                    developers: '',
                                                    url: '',
                                                    imageUrl: '',
                                                    status: 'Disponível'
                                                });
                                                setEditingId(null);
                                            }}
                                            className="px-4 py-2 bg-vibrant text-white text-sm font-semibold rounded-xl hover:bg-institutional transition-all shadow-sm">
                                            + Nova Plataforma
                                        </button>
                                    </div>

                                    {/* Formulário de Cadastro / Edição */}
                                    <div className="bg-white border border-slate-200 rounded-3xl p-8 shadow-sm">
                                        <h4 className="text-lg font-bold text-navy mb-6">
                                            {editingId ? 'Editar Plataforma' : 'Cadastrar Nova Plataforma'}
                                        </h4>
                                        <form onSubmit={handleSavePlatform} className="space-y-6">
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Nome da Plataforma *</label>
                                                    <input 
                                                        type="text" 
                                                        value={form.title}
                                                        onChange={e => setForm({...form, title: e.target.value})}
                                                        placeholder="Ex: GestorPro Simulações"
                                                        required
                                                        className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-vibrant"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Link Externo da Plataforma (URL) *</label>
                                                    <input 
                                                        type="url" 
                                                        value={form.url}
                                                        onChange={e => setForm({...form, url: e.target.value})}
                                                        placeholder="https://exemplo.com"
                                                        required
                                                        className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-vibrant"
                                                    />
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Desenvolvedores (Estudantes)</label>
                                                    <input 
                                                        type="text" 
                                                        value={form.developers}
                                                        onChange={e => setForm({...form, developers: e.target.value})}
                                                        placeholder="Ex: Ana Silva, Carlos Eduardo"
                                                        className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-vibrant"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Status do Projeto</label>
                                                    <select 
                                                        value={form.status}
                                                        onChange={e => setForm({...form, status: e.target.value})}
                                                        className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-vibrant">
                                                        <option value="Disponível">Disponível</option>
                                                        <option value="Em Desenvolvimento">Em Desenvolvimento</option>
                                                        <option value="Experimental">Experimental</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">URL da Imagem de Capa (Opcional)</label>
                                                <input 
                                                    type="url" 
                                                    value={form.imageUrl}
                                                    onChange={e => setForm({...form, imageUrl: e.target.value})}
                                                    placeholder="https://exemplo.com/imagem.png"
                                                    className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-vibrant"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Descrição Completa</label>
                                                <textarea 
                                                    rows="3"
                                                    value={form.description}
                                                    onChange={e => setForm({...form, description: e.target.value})}
                                                    placeholder="Descreva o objetivo e funcionamento da plataforma..."
                                                    className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-vibrant"
                                                ></textarea>
                                            </div>

                                            <div className="flex justify-end space-x-4 pt-4 border-t border-slate-100">
                                                {editingId && (
                                                    <button 
                                                        type="button" 
                                                        onClick={() => {
                                                            setEditingId(null);
                                                            setForm({
                                                                title: '',
                                                                description: '',
                                                                problem: '',
                                                                objective: '',
                                                                developers: '',
                                                                url: '',
                                                                imageUrl: '',
                                                                status: 'Disponível'
                                                            });
                                                        }}
                                                        className="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition-colors">
                                                        Cancelar
                                                    </button>
                                                )}
                                                <button 
                                                    type="submit" 
                                                    className="px-6 py-2.5 bg-navy hover:bg-institutional text-white font-semibold rounded-xl text-sm transition-all shadow-md">
                                                    {editingId ? 'Salvar Alterações' : 'Cadastrar Plataforma'}
                                                </button>
                                            </div>
                                        </form>
                                    </div>

                                    {/* Lista de Gerenciamento */}
                                    <div className="bg-white border border-slate-200 rounded-3xl p-8 shadow-sm">
                                        <h4 className="text-lg font-bold text-navy mb-6">Plataformas Cadastradas ({platforms.length})</h4>
                                        {platforms.length === 0 ? (
                                            <p className="text-slate-500 text-sm">Nenhuma plataforma cadastrada no momento.</p>
                                        ) : (
                                            <div className="divide-y divide-slate-100">
                                                {platforms.map(p => (
                                                    <div key={p.id} className="py-4 flex items-center justify-between">
                                                        <div>
                                                            <h5 className="font-bold text-navy text-base">{p.title}</h5>
                                                            <p className="text-xs text-slate-500 truncate max-w-md">{p.url}</p>
                                                        </div>
                                                        <div className="flex items-center space-x-3">
                                                            <button 
                                                                onClick={() => handleEdit(p)}
                                                                className="px-3 py-1.5 bg-blue-50 text-vibrant hover:bg-blue-100 font-semibold text-xs rounded-lg transition-colors">
                                                                Editar
                                                            </button>
                                                            <button 
                                                                onClick={() => handleDelete(p.id)}
                                                                className="px-3 py-1.5 bg-red-50 text-red-600 hover:bg-red-100 font-semibold text-xs rounded-lg transition-colors">
                                                                Excluir
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </main>

                        {/* Rodapé */}
                        <footer className="bg-white border-t border-slate-100 py-6 px-8 text-center text-xs text-slate-400">
                            <p>ADM.INOVA — Mostra Digital de Administração e Empreendedorismo • CETI José Marques</p>
                        </footer>
                    </div>

                    {/* Modal de Login Admin */}
                    {showLoginModal && (
                        <div className="fixed inset-0 bg-navy/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl relative">
                                <div className="text-center mb-6">
                                    <div className="w-12 h-12 bg-vibrant/10 text-vibrant rounded-2xl flex items-center justify-center mx-auto mb-3">
                                        <i data-lucide="shield-check" className="w-6 h-6"></i>
                                    </div>
                                    <h3 className="text-xl font-bold text-navy">Área do Administrador</h3>
                                    <p className="text-xs text-slate-500 mt-1">Insira suas credenciais para gerenciar as plataformas</p>
                                </div>

                                {loginError && (
                                    <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-xl text-xs font-medium text-center">
                                        {loginError}
                                    </div>
                                )}

                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Usuário</label>
                                        <input 
                                            type="text" 
                                            value={loginUser}
                                            onChange={e => setLoginUser(e.target.value)}
                                            placeholder="admin"
                                            required
                                            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-vibrant"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Senha</label>
                                        <input 
                                            type="password" 
                                            value={loginPass}
                                            onChange={e => setLoginPass(e.target.value)}
                                            placeholder="••••••••"
                                            required
                                            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-vibrant"
                                        />
                                    </div>
                                    <div className="flex space-x-3 pt-2">
                                        <button 
                                            type="button"
                                            onClick={() => setShowLoginModal(false)}
                                            className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 t                                            <button 
                                                type="button"
                                                onClick={() => setShowLoginModal(false)}
                                                className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition-colors">
                                                Cancelar
                                            </button>
                                            <button 
                                                type="submit"
                                                className="flex-1 py-3 bg-navy hover:bg-institutional text-white font-semibold rounded-xl text-sm transition-all shadow-md">
                                                Entrar
                                            </button>
                                        </div>
                                        <p className="text-center text-[10px] text-slate-400 mt-4">
                                            Dica padrão: usuário <code className="bg-slate-100 px-1 py-0.5 rounded text-slate-600 font-mono">admin</code> e senha <code className="bg-slate-100 px-1 py-0.5 rounded text-slate-600 font-mono">admin2026</code>
                                        </p>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        </script>
    </body>
</html>
